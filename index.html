<!DOCTYPE html>
<html lang="ms" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Perpustakaan Ibnu Sina</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    /* Custom scrollbar untuk tema gelap */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #020617;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 selection:bg-amber-500/30 selection:text-amber-200">
  <!-- Kontena Toast Pemberitahuan -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none px-4 sm:px-0"></div>

  <!-- Kontena Utama Aplikasi -->
  <div id="app" class="min-h-screen flex flex-col"></div>

  <!-- Kontena Modal -->
  <div id="modal-container"></div>

  <script>
    // ============================================================================
    // PORTAL PERPUSTAKAAN IBNU SINA - TETAPAN & DATA AWAL
    // ============================================================================
    const STORAGE_KEY = 'ibnu_sina_library_ms_v5';
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbziWJKx-C7kR0UWDSIggwxaqs4qkKKnDKtvfgMJs00wKvoXDzstohiGl7bprYS-AxID-g/exec';

    const LOAN_DURATION_DAYS = 14;
    const DAILY_FINE_RATE = 0.50;
    const MAX_RENEWALS = 2;
    const FINE_BLOCK_THRESHOLD = 10.00;

    const INITIAL_DATA = {
      systemDate: new Date().toISOString().split('T')[0],
      currentUser: null,
      settings: {
        libraryName: 'Portal Perpustakaan Ibnu Sina',
        loanDurationDays: 14,
        dailyFineRate: 0.50,
        maxRenewals: 2,
        fineBlockThreshold: 10.00,
        studentMaxLimit: 5,
        teacherMaxLimit: 10
      },
      staffList: [
        {
          id: 'STF-001',
          identityNumber: '101124110387',
          name: 'MUHAMMAD AZRI BIN MOHD NAZROL',
          position: 'Ketua Pustakawan'
        },
        {
          id: 'STF-002',
          identityNumber: 'LIB-001',
          name: 'ENCIK RAHMAN BIN ISMAIL',
          position: 'Pustakawan Kanan'
        }
      ],
      members: [
        {
          id: '1001',
          identityNumber: 'STU-1001',
          name: 'ALICE TAN',
          email: 'm-1001@moe-dl.edu.my',
          tier: 'Pelajar',
          maxLimit: 5,
          status: 'Aktif',
          fineBalance: 0.00,
          joinedDate: '2024-01-15'
        },
        {
          id: '1002',
          identityNumber: 'STU-1002',
          name: 'BOB LIM',
          email: 'm-1002@moe-dl.edu.my',
          tier: 'Pelajar',
          maxLimit: 5,
          status: 'Aktif',
          fineBalance: 0.00,
          joinedDate: '2024-03-10'
        },
        {
          id: '1003',
          identityNumber: '040512-11-5231',
          name: 'AHMAD BIN ALI',
          email: 'm-040512@moe-dl.edu.my',
          tier: 'Pelajar',
          maxLimit: 5,
          status: 'Aktif',
          fineBalance: 0.00,
          joinedDate: '2024-05-20'
        },
        {
          id: '1004',
          identityNumber: 'STU-1004',
          name: 'SARAH JENKINS',
          email: 'g-1004@moe-dl.edu.my',
          tier: 'Guru',
          maxLimit: 10,
          status: 'Aktif',
          fineBalance: 0.00,
          joinedDate: '2023-11-02'
        }
      ],
      books: [],
      copies: [],
      loans: [],
      holds: [],
      logs: [
        {
          id: 'LOG-001',
          timestamp: new Date().toISOString().split('T')[0],
          type: 'sistem',
          message: 'Portal Perpustakaan Ibnu Sina sedia digunakan.'
        }
      ]
    };

    // ============================================================================
    // KEADAAN GLOBAL APLIKASI
    // ============================================================================
    let state = loadInitialState();
    let cloudUrl = APPS_SCRIPT_URL;
    let cloudStatus = 'syncing'; // 'syncing' | 'synced' | 'error'
    let lastCloudSync = null;
    let isInitialCloudFetchDone = false;
    let cloudSyncTimer = null;

    // Keadaan UI Sementara
    let ui = {
      loginRole: 'student', // 'student' | 'librarian'
      loginName: '',
      loginIdentity: '',
      loginDelimaEmail: '',
      loginError: '',
      activeTab: 'catalog',
      searchQuery: '',
      selectedCategory: 'Semua',
      checkoutPatronId: state.members[0]?.id || '1001',
      checkoutCopyId: '',
      checkinCopyId: '',
      checkinDamaged: false,
      activeModal: null, // 'addBook' | 'editBook' | 'importBooks' | 'addCopy' | 'addMember' | 'editMember' | 'importMembers' | 'confirmDelete'
      selectedBookForCopies: null,
      editingBook: null,
      editingMember: null,
      deleteTarget: null // { type: 'book' | 'member', id: string, title: string }
    };

    function loadInitialState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          return {
            ...INITIAL_DATA,
            ...parsed,
            settings: { ...INITIAL_DATA.settings, ...(parsed.settings || {}) },
            staffList: parsed.staffList || INITIAL_DATA.staffList
          };
        }
      } catch (e) {
        console.error('Gagal memuatkan data setempat:', e);
      }
      return JSON.parse(JSON.stringify(INITIAL_DATA));
    }

    function saveState(triggerCloud = true) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.error('Gagal menyimpan ke localStorage:', e);
      }

      if (triggerCloud && cloudUrl && isInitialCloudFetchDone) {
        clearTimeout(cloudSyncTimer);
        cloudSyncTimer = setTimeout(() => {
          pushToCloud(state, cloudUrl);
        }, 1200);
      }
    }

    // ============================================================================
    // FUNGSI BANTUAN TARIKH, ID & KESELAMATAN HTML
    // ============================================================================
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function addDays(dateStr, days) {
      const date = new Date(dateStr + 'T00:00:00');
      date.setDate(date.getDate() + days);
      return date.toISOString().split('T')[0];
    }

    function diffDays(dateStr1, dateStr2) {
      const d1 = new Date(dateStr1 + 'T00:00:00');
      const d2 = new Date(dateStr2 + 'T00:00:00');
      return Math.floor((d2 - d1) / (1000 * 60 * 60 * 24));
    }

    function generateId(prefix) {
      return `${prefix}-${Math.floor(1000 + Math.random() * 9000)}`;
    }

    function generate4DigitMemberId(existingMembersList) {
      const usedIds = new Set(existingMembersList.map((m) => String(m.id)));
      let candidate = '';
      do {
        candidate = String(Math.floor(1000 + Math.random() * 9000));
      } while (usedIds.has(candidate));
      return candidate;
    }

    function addLog(type, message) {
      state.logs = [
        {
          id: generateId('LOG'),
          timestamp: state.systemDate,
          type,
          message
        },
        ...state.logs
      ].slice(0, 60);
    }

    // ============================================================================
    // PEMBERITAHUAN TOAST
    // ============================================================================
    function notify(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const id = 'toast-' + Date.now() + Math.floor(Math.random() * 1000);
      const isError = type === 'error';

      const toastEl = document.createElement('div');
      toastEl.id = id;
      toastEl.className = `pointer-events-auto flex items-start gap-3 p-3.5 rounded-xl border shadow-2xl backdrop-blur-md transition-all ${
        isError
          ? 'bg-rose-950/90 border-rose-500/40 text-rose-100'
          : 'bg-emerald-950/90 border-emerald-500/40 text-emerald-100'
      }`;
      toastEl.innerHTML = `
        <i data-lucide="${isError ? 'alert-triangle' : 'check-circle-2'}" class="w-5 h-5 ${
        isError ? 'text-rose-400' : 'text-emerald-400'
      } shrink-0 mt-0.5"></i>
        <p class="text-xs font-medium leading-relaxed">${escapeHtml(message)}</p>
      `;

      container.appendChild(toastEl);
      if (window.lucide) lucide.createIcons();

      setTimeout(() => {
        const el = document.getElementById(id);
        if (el) el.remove();
      }, 4500);
    }

    // ============================================================================
    // CLOUD DATABASE (GOOGLE APPS SCRIPT)
    // ============================================================================
    async function fetchFromCloud(targetUrl = cloudUrl, silent = false) {
      if (!targetUrl) return;
      cloudStatus = 'syncing';
      render();
      try {
        const response = await fetch(targetUrl);
        const result = await response.json();
        if (result.status === 'success' && result.data) {
          const currentUserBackup = state.currentUser;
          state = {
            ...INITIAL_DATA,
            ...result.data,
            currentUser: currentUserBackup
          };
          saveState(false);
          cloudStatus = 'synced';
          lastCloudSync = result.lastUpdated || new Date().toISOString();
          if (!silent) notify('Data berjaya diselaraskan dari Cloud Database!');
        } else {
          cloudStatus = 'synced';
        }
      } catch (err) {
        console.error('Ralat tarik data Cloud:', err);
        cloudStatus = 'error';
        if (!silent) notify('Gagal menyambung ke Google Apps Script.', 'error');
      } finally {
        isInitialCloudFetchDone = true;
        render();
      }
    }

    async function pushToCloud(payloadData, targetUrl = cloudUrl) {
      if (!targetUrl) return;
      cloudStatus = 'syncing';
      renderHeaderOnlyIfPossible();
      try {
        const { currentUser, ...persistentData } = payloadData;
        const response = await fetch(targetUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'save',
            data: persistentData
          })
        });
        const result = await response.json();
        if (result.status === 'success') {
          cloudStatus = 'synced';
          lastCloudSync = result.lastUpdated || new Date().toISOString();
        } else {
          cloudStatus = 'error';
        }
      } catch (err) {
        console.error('Ralat simpan ke Cloud:', err);
        cloudStatus = 'error';
      }
      renderHeaderOnlyIfPossible();
    }

    function renderHeaderOnlyIfPossible() {
      // Kemas kini penuh hanya jika pengguna tidak sedang menaip dalam input
      const activeTag = document.activeElement?.tagName;
      if (activeTag !== 'INPUT' && activeTag !== 'TEXTAREA' && activeTag !== 'SELECT') {
        render();
      }
    }

    // ============================================================================
    // PENGESAHAN LOG MASUK & LOG KELUAR
    // ============================================================================
    function handleLoginSubmit(e) {
      e.preventDefault();
      ui.loginError = '';

      const trimmedName = ui.loginName.trim().toUpperCase();
      const trimmedId = ui.loginIdentity.trim().toUpperCase();
      const trimmedEmail = ui.loginDelimaEmail.trim().toLowerCase();

      if (!trimmedName || !trimmedId) {
        ui.loginError = 'Sila masukkan Nama Penuh dan Nombor Pengenalan anda.';
        render();
        return;
      }

      if (ui.loginRole === 'student') {
        const existingIdx = state.members.findIndex(
          (m) => m.identityNumber.toUpperCase() === trimmedId
        );

        if (existingIdx !== -1) {
          const existingMember = state.members[existingIdx];
          state.members[existingIdx] = {
            ...existingMember,
            name: trimmedName
          };
          state.currentUser = {
            role: 'student',
            id: existingMember.id,
            name: trimmedName,
            identityNumber: existingMember.identityNumber,
            email: existingMember.email
          };
          addLog('sistem', `Log Masuk Pelajar: ${trimmedName} (${trimmedId}) melog masuk ke Portal Pelajar.`);
          saveState();
          notify(`SELAMAT KEMBALI, ${trimmedName}!`);
        } else {
          if (!trimmedEmail) {
            ui.loginError = 'Pendaftaran kali pertama: Sila masukkan Emel DELIMa anda.';
            render();
            return;
          }

          const newMemberId = generate4DigitMemberId(state.members);
          const newMember = {
            id: newMemberId,
            identityNumber: trimmedId,
            name: trimmedName,
            email: trimmedEmail,
            tier: 'Pelajar',
            maxLimit: 5,
            status: 'Aktif',
            fineBalance: 0.00,
            joinedDate: state.systemDate
          };

          state.members.push(newMember);
          state.currentUser = {
            role: 'student',
            id: newMember.id,
            name: newMember.name,
            identityNumber: newMember.identityNumber,
            email: newMember.email
          };
          addLog(
            'sistem',
            `Pendaftaran Automatik & Log Masuk: ${trimmedName} (ID: ${trimmedId}, DELIMa: ${trimmedEmail}, No. Kad Ahli: ${newMemberId}).`
          );
          saveState();
          notify(`AKAUN BERJAYA DIDAFTARKAN! NO. KAD AHLI: ${newMemberId}`);
        }
        ui.activeTab = 'loans';
      } else {
        const matchedStaff = state.staffList.find(
          (s) => s.identityNumber.toUpperCase() === trimmedId
        );

        if (!matchedStaff) {
          ui.loginError = 'Nombor Pengenalan Staf tidak ditemui dalam sistem.';
          render();
          return;
        }

        state.currentUser = {
          role: 'librarian',
          id: matchedStaff.id,
          name: trimmedName,
          identityNumber: matchedStaff.identityNumber
        };
        addLog('sistem', `Log Masuk Staf: ${trimmedName} (${trimmedId}) melog masuk ke Kaunter Staf.`);
        saveState();
        ui.activeTab = 'circulation';
        notify(`SELAMAT BERTUGAS, ${trimmedName}!`);
      }

      ui.loginName = '';
      ui.loginIdentity = '';
      ui.loginDelimaEmail = '';
      render();
    }

    function handleLogout() {
      state.currentUser = null;
      ui.loginError = '';
      saveState(false);
      notify('Anda telah berjaya log keluar.');
      render();
    }

    // ============================================================================
    // DATA TERBITAN (COMPUTED STATE)
    // ============================================================================
    function getEnrichedLoans() {
      return state.loans.map((loan) => {
        const book = state.books.find((b) => b.id === loan.bookId);
        const patron = state.members.find((m) => m.id === loan.patronId);
        const isReturned = loan.status === 'Dipulangkan';
        const overdueDays = isReturned
          ? Math.max(0, diffDays(loan.dueDate, loan.returnDate))
          : Math.max(0, diffDays(loan.dueDate, state.systemDate));
        const accruedFine = isReturned
          ? loan.fineAmount
          : Number((overdueDays * DAILY_FINE_RATE).toFixed(2));
        const effectiveStatus = isReturned
          ? 'Dipulangkan'
          : overdueDays > 0
          ? 'Tertunggak'
          : 'Aktif';

        return {
          ...loan,
          bookTitle: book?.title || 'BUKU TIDAK DIKETAHUI',
          bookAuthor: book?.author || 'PENGARANG TIDAK DIKETAHUI',
          patronName: patron?.name || 'AHLI TIDAK DIKETAHUI',
          overdueDays,
          accruedFine,
          effectiveStatus
        };
      });
    }

    function validateCheckoutEligibility(patron, copyId) {
      if (!patron) return { valid: false, reason: 'Sila pilih rekod ahli yang sah.' };
      if (patron.status !== 'Aktif') {
        return { valid: false, reason: `Akaun ahli berstatus ${patron.status}. Peminjaman disekat.` };
      }

      const enriched = getEnrichedLoans();
      const activePatronLoans = enriched.filter(
        (l) => l.patronId === patron.id && l.effectiveStatus !== 'Dipulangkan'
      );
      const liveOverdueFines = activePatronLoans.reduce((sum, l) => sum + l.accruedFine, 0);
      const totalExposure = patron.fineBalance + liveOverdueFines;

      if (totalExposure >= FINE_BLOCK_THRESHOLD) {
        return {
          valid: false,
          reason: `Jumlah denda (RM ${totalExposure.toFixed(2)}) melebihi had sekatan RM ${FINE_BLOCK_THRESHOLD.toFixed(2)}.`
        };
      }

      if (activePatronLoans.length >= patron.maxLimit) {
        return {
          valid: false,
          reason: `Had pinjaman maksimum tercapai (${activePatronLoans.length}/${patron.maxLimit} buku).`
        };
      }

      if (!copyId) return { valid: false, reason: 'Sila pilih atau imbas kod bar naskhah buku.' };

      const copy = state.copies.find((c) => c.id.toLowerCase() === copyId.trim().toLowerCase());
      if (!copy) return { valid: false, reason: `Kod bar "${copyId}" tidak ditemui dalam inventori.` };

      const book = state.books.find((b) => b.id === copy.bookId);
      if (book?.isReference) {
        return { valid: false, reason: `"${book.title}" adalah bahan Rujukan Sahaja dan tidak boleh dipinjam keluar.` };
      }

      if (copy.status === 'Dipinjam') {
        return { valid: false, reason: `Naskhah ${copy.id} sedang dipinjam oleh ahli lain.` };
      }
      if (copy.status === 'Rosak' || copy.status === 'Hilang') {
        return { valid: false, reason: `Naskhah ${copy.id} ditandakan sebagai ${copy.status}.` };
      }
      if (copy.status === 'Ditempah' && copy.heldForPatronId !== patron.id) {
        return { valid: false, reason: `Naskhah ${copy.id} sedang ditempah untuk ahli lain.` };
      }

      const alreadyHasBook = activePatronLoans.some((l) => l.bookId === copy.bookId);
      if (alreadyHasBook) {
        return { valid: false, reason: `Ahli ini sudah meminjam naskhah lain bagi judul "${book?.title}".` };
      }

      return { valid: true, copy, book };
    }

    // ============================================================================
    // TINDAKAN SIRKULASI: PINJAM, PULANG, TEMPAH, PERBAHARUI
    // ============================================================================
    function handleCheckout(patronId, copyId) {
      const patron = state.members.find((m) => m.id === patronId);
      const check = validateCheckoutEligibility(patron, copyId);

      if (!check.valid) {
        notify(check.reason, 'error');
        return;
      }

      const { copy, book } = check;
      const loanDays = Number(state.settings?.loanDurationDays) || LOAN_DURATION_DAYS;
      const dueDate = addDays(state.systemDate, loanDays);
      const newLoan = {
        id: generateId('LN'),
        copyId: copy.id,
        bookId: book.id,
        patronId: patron.id,
        issueDate: state.systemDate,
        dueDate,
        returnDate: null,
        renewals: 0,
        status: 'Aktif',
        fineAmount: 0
      };

      state.copies = state.copies.map((c) =>
        c.id === copy.id ? { ...c, status: 'Dipinjam', heldForPatronId: null } : c
      );

      state.holds = state.holds.map((h) =>
        h.bookId === book.id && h.patronId === patron.id && h.status === 'Sedia Diambil'
          ? { ...h, status: 'Selesai' }
          : h
      );

      state.loans.unshift(newLoan);
      addLog('pinjaman', `Pinjaman: "${book.title}" (${copy.id}) dipinjamkan kepada ${patron.name}. Tarikh pulang: ${dueDate}.`);
      saveState();

      ui.checkoutCopyId = '';
      notify(`Berjaya pinjam "${book.title}" kepada ${patron.name} (Pulang: ${dueDate}).`);
      render();
    }

    function handleCheckin(copyId, isDamaged = false) {
      const copy = state.copies.find((c) => c.id.toLowerCase() === copyId.trim().toLowerCase());
      if (!copy) {
        notify(`Naskhah "${copyId}" tidak ditemui dalam inventori.`, 'error');
        return;
      }

      const activeLoan = state.loans.find((l) => l.copyId === copy.id && l.status !== 'Dipulangkan');
      const book = state.books.find((b) => b.id === copy.bookId);

      if (!activeLoan && copy.status === 'Tersedia') {
        notify(`Naskhah ${copy.id} sudah pun berstatus Tersedia di rak.`, 'error');
        return;
      }

      let fineCharged = 0;
      const damageFee = isDamaged ? 15.00 : 0;

      if (activeLoan) {
        const overdueDays = Math.max(0, diffDays(activeLoan.dueDate, state.systemDate));
        const fineRate = Number(state.settings?.dailyFineRate) || DAILY_FINE_RATE;
        fineCharged = Number((overdueDays * fineRate).toFixed(2));
        const totalPenalty = fineCharged + damageFee;

        state.loans = state.loans.map((l) =>
          l.id === activeLoan.id
            ? {
                ...l,
                returnDate: state.systemDate,
                status: 'Dipulangkan',
                fineAmount: totalPenalty
              }
            : l
        );

        if (totalPenalty > 0) {
          state.members = state.members.map((m) =>
            m.id === activeLoan.patronId
              ? { ...m, fineBalance: Number((m.fineBalance + totalPenalty).toFixed(2)) }
              : m
          );
        }
      }

      let nextCopyStatus = 'Tersedia';
      let heldForPatronId = null;
      let holdAlert = '';

      if (isDamaged) {
        nextCopyStatus = 'Rosak';
      } else {
        const nextHold = state.holds.find(
          (h) => h.bookId === copy.bookId && h.status === 'Menunggu'
        );
        if (nextHold) {
          nextCopyStatus = 'Ditempah';
          heldForPatronId = nextHold.patronId;
          const expiryDate = addDays(state.systemDate, 2);
          state.holds = state.holds.map((h) =>
            h.id === nextHold.id
              ? { ...h, status: 'Sedia Diambil', assignedCopyId: copy.id, expiryDate }
              : h
          );
          const holdPatron = state.members.find((m) => m.id === nextHold.patronId);
          holdAlert = ` Ditempah untuk ${holdPatron?.name} (ambil sebelum ${expiryDate}).`;
        }
      }

      state.copies = state.copies.map((c) =>
        c.id === copy.id ? { ...c, status: nextCopyStatus, heldForPatronId } : c
      );

      addLog(
        'pemulangan',
        `Pemulangan: "${book?.title}" (${copy.id}) dipulangkan. Status: ${nextCopyStatus}.${
          fineCharged > 0 ? ` Denda lewat: RM ${fineCharged.toFixed(2)}.` : ''
        }${isDamaged ? ' Yuran kerosakan RM 15.00 dikenakan.' : ''}${holdAlert}`
      );
      saveState();

      ui.checkinCopyId = '';
      ui.checkinDamaged = false;
      notify(`"${book?.title}" dipulangkan → ${nextCopyStatus}.${holdAlert}`);
      render();
    }

    function handlePlaceHold(bookId, patronId) {
      const patron = state.members.find((m) => m.id === patronId);
      const book = state.books.find((b) => b.id === bookId);
      if (!patron || !book) return;

      if (book.isReference) {
        notify('Bahan Rujukan Sahaja tidak boleh ditempah.', 'error');
        return;
      }

      const existingHold = state.holds.find(
        (h) =>
          h.bookId === bookId &&
          h.patronId === patronId &&
          (h.status === 'Menunggu' || h.status === 'Sedia Diambil')
      );
      if (existingHold) {
        notify('Anda sudah mempunyai tempahan aktif bagi buku ini.', 'error');
        return;
      }

      const activeLoan = state.loans.find(
        (l) => l.bookId === bookId && l.patronId === patronId && l.status !== 'Dipulangkan'
      );
      if (activeLoan) {
        notify('Anda sedang meminjam naskhah buku ini.', 'error');
        return;
      }

      state.holds.push({
        id: generateId('HLD'),
        bookId,
        patronId,
        requestDate: state.systemDate,
        expiryDate: null,
        assignedCopyId: null,
        status: 'Menunggu'
      });

      addLog('tempahan', `Tempahan: ${patron.name} menempah judul "${book.title}".`);
      saveState();
      notify(`Tempahan berjaya bagi "${book.title}".`);
      render();
    }

    function handleRenewLoan(loanId) {
      const loan = getEnrichedLoans().find((l) => l.id === loanId);
      if (!loan) return;
      const maxRen = Number(state.settings?.maxRenewals) || MAX_RENEWALS;

      if (loan.effectiveStatus === 'Tertunggak') {
        notify('Buku yang tertunggak tidak boleh diperbaharui. Sila pulangkan di kaunter.', 'error');
        return;
      }
      if (loan.renewals >= maxRen) {
        notify(`Had maksimum pembaharuan (${maxRen}) telah dicapai.`, 'error');
        return;
      }

      const hasPendingHolds = state.holds.some(
        (h) => h.bookId === loan.bookId && h.status === 'Menunggu'
      );
      if (hasPendingHolds) {
        notify('Pembaharuan ditolak: Terdapat ahli lain sedang menunggu tempahan buku ini.', 'error');
        return;
      }

      const loanDays = Number(state.settings?.loanDurationDays) || LOAN_DURATION_DAYS;
      const newDueDate = addDays(loan.dueDate, loanDays);
      state.loans = state.loans.map((l) =>
        l.id === loanId ? { ...l, dueDate: newDueDate, renewals: l.renewals + 1 } : l
      );

      addLog('pembaharuan', `Pembaharuan: Pinjaman "${loan.bookTitle}" (${loan.copyId}) dilanjutkan sehingga ${newDueDate}.`);
      saveState();
      notify(`Pinjaman diperbaharui! Tarikh pulang baharu: ${newDueDate}`);
      render();
    }

    function handleCancelHold(holdId) {
      const hold = state.holds.find((h) => h.id === holdId);
      if (!hold) return;

      state.holds = state.holds.map((h) =>
        h.id === holdId ? { ...h, status: 'Dibatalkan' } : h
      );

      if (hold.status === 'Sedia Diambil' && hold.assignedCopyId) {
        const nextHold = state.holds.find(
          (h) => h.bookId === hold.bookId && h.status === 'Menunggu'
        );
        if (nextHold) {
          const expiryDate = addDays(state.systemDate, 2);
          state.holds = state.holds.map((h) =>
            h.id === nextHold.id
              ? { ...h, status: 'Sedia Diambil', assignedCopyId: hold.assignedCopyId, expiryDate }
              : h
          );
          state.copies = state.copies.map((c) =>
            c.id === hold.assignedCopyId ? { ...c, heldForPatronId: nextHold.patronId } : c
          );
        } else {
          state.copies = state.copies.map((c) =>
            c.id === hold.assignedCopyId
              ? { ...c, status: 'Tersedia', heldForPatronId: null }
              : c
          );
        }
      }

      addLog('tempahan', `Tempahan ${hold.id} telah dibatalkan.`);
      saveState();
      notify('Tempahan berjaya dibatalkan.');
      render();
    }

    function handleImportBooksCsv(csvText) {
      const lines = csvText
        .split(/\r?\n/)
        .map((l) => l.trim())
        .filter((l) => l.length > 0);

      if (lines.length === 0) {
        notify('Fail CSV kosong. Sila masukkan data buku.', 'error');
        return;
      }

      const addedBooks = [];
      const addedCopies = [];

      lines.forEach((line, idx) => {
        const cols = line.split(',').map((c) => c.trim());
        if (idx === 0 && (cols[0].toLowerCase() === 'tajuk' || cols[0].toLowerCase() === 'title')) {
          return;
        }
        if (cols.length < 2 || !cols[0] || !cols[1]) return;

        const title = cols[0].toUpperCase();
        const author = cols[1].toUpperCase();
        const isbn = (cols[2] || `ISBN-${Math.floor(100000 + Math.random() * 900000)}`).toUpperCase();
        const category = cols[3] || 'Umum';
        const dewey = (cols[4] || '000.00').toUpperCase();
        const copyCount = Math.max(1, parseInt(cols[5], 10) || 1);
        const isReference = (cols[6] || '').toLowerCase() === 'ya' || (cols[6] || '').toLowerCase() === 'true';

        const newBookId = `BK-${Math.floor(1000 + Math.random() * 9000)}-${idx}`;
        addedBooks.push({
          id: newBookId,
          title,
          author,
          isbn,
          category,
          year: new Date().getFullYear(),
          dewey,
          coverColor: 'from-amber-600 to-orange-700',
          isReference,
          summary: 'Diimport melalui fail CSV.'
        });

        for (let i = 0; i < copyCount; i++) {
          addedCopies.push({
            id: `BC-${Math.floor(10000 + Math.random() * 90000)}-${i + 1}`,
            bookId: newBookId,
            location: `Rak ${category} • ${dewey}`,
            status: 'Tersedia',
            heldForPatronId: null
          });
        }
      });

      if (addedBooks.length === 0) {
        notify('Tiada baris buku yang sah ditemui dalam CSV.', 'error');
        return;
      }

      state.books = [...addedBooks, ...state.books];
      state.copies.push(...addedCopies);
      addLog('katalog', `Import CSV Buku: ${addedBooks.length} judul buku (${addedCopies.length} naskhah) berjaya diimport.`);
      saveState();

      ui.activeModal = null;
      notify(`${addedBooks.length} judul buku berjaya diimport daripada CSV!`);
      render();
    }

    function handleImportMembersCsv(csvText) {
      const lines = csvText
        .split(/\r?\n/)
        .map((l) => l.trim())
        .filter((l) => l.length > 0);

      if (lines.length === 0) {
        notify('Fail CSV kosong. Sila masukkan data pelajar.', 'error');
        return;
      }

      const limits = { Biasa: 5, Pelajar: 5, Guru: 10 };
      const addedMembers = [];
      const existingIds = new Set(state.members.map((m) => m.identityNumber.toUpperCase()));
      const usedCardIds = new Set(state.members.map((m) => String(m.id)));

      lines.forEach((line, idx) => {
        const cols = line.split(',').map((c) => c.trim());
        if (idx === 0 && (cols[0].toLowerCase() === 'nama' || cols[0].toLowerCase() === 'name')) {
          return;
        }
        if (cols.length < 2 || !cols[0] || !cols[1]) return;

        const name = cols[0].toUpperCase();
        const identityNumber = cols[1].toUpperCase();
        if (existingIds.has(identityNumber)) return;

        let cardId = '';
        do {
          cardId = String(Math.floor(1000 + Math.random() * 9000));
        } while (usedCardIds.has(cardId));
        usedCardIds.add(cardId);

        const email = (cols[2] || `${name.toLowerCase().replace(/\s+/g, '.')}@moe-dl.edu.my`).toLowerCase();
        const rawTier = cols[3] || 'Pelajar';
        const tier = ['Pelajar', 'Biasa', 'Guru'].includes(rawTier) ? rawTier : 'Pelajar';

        existingIds.add(identityNumber);
        addedMembers.push({
          id: cardId,
          identityNumber,
          name,
          email,
          tier,
          maxLimit: limits[tier] || 5,
          status: 'Aktif',
          fineBalance: 0.00,
          joinedDate: state.systemDate
        });
      });

      if (addedMembers.length === 0) {
        notify('Tiada rekod pelajar baharu yang sah ditemui (atau ID sudah wujud).', 'error');
        return;
      }

      state.members.push(...addedMembers);
      addLog('sistem', `Import CSV Pelajar: ${addedMembers.length} ahli baharu berjaya diimport.`);
      saveState();

      ui.activeModal = null;
      notify(`${addedMembers.length} pelajar/ahli berjaya diimport daripada CSV!`);
      render();
    }

    function renderStudentBarcode() {
      if (!state.currentUser || state.currentUser.role !== 'student') return;
      const activePatron =
        state.members.find((m) => m.id === state.currentUser.id) || state.members[0];
      const svgEl = document.getElementById('student-identity-barcode');
      if (svgEl && activePatron && window.JsBarcode) {
        try {
          JsBarcode(svgEl, activePatron.identityNumber, {
            format: 'CODE128',
            lineColor: '#0f172a',
            background: '#ffffff',
            width: 1.7,
            height: 44,
            displayValue: true,
            fontSize: 11,
            font: 'monospace',
            margin: 6
          });
        } catch (err) {
          console.error('Ralat menjana barkod ahli:', err);
        }
      }
    }

    function downloadStudentBarcode() {
      const svgEl = document.getElementById('student-identity-barcode');
      if (!svgEl) return;
      const activePatron =
        state.members.find((m) => m.id === state.currentUser?.id) || state.members[0];
      const serializer = new XMLSerializer();
      const svgStr = serializer.serializeToString(svgEl);
      const canvas = document.createElement('canvas');
      const img = new Image();
      img.onload = () => {
        canvas.width = img.width * 2;
        canvas.height = img.height * 2;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const link = document.createElement('a');
        link.download = `BARKOD-AHLI-${activePatron?.identityNumber || 'PELAJAR'}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        notify('Imej barkod ahli berjaya dimuat turun!');
      };
      img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgStr)));
    }

    function bindLoginEvents() {
      document.getElementById('btn-role-student')?.addEventListener('click', () => {
        ui.loginRole = 'student';
        ui.loginError = '';
        render();
      });

      document.getElementById('btn-role-librarian')?.addEventListener('click', () => {
        ui.loginRole = 'librarian';
        ui.loginError = '';
        render();
      });

      const nameInput = document.getElementById('input-login-name');
      nameInput?.addEventListener('input', (e) => {
        ui.loginName = e.target.value.toUpperCase();
        e.target.value = ui.loginName;
      });

      const identityInput = document.getElementById('input-login-identity');
      identityInput?.addEventListener('input', (e) => {
        ui.loginIdentity = e.target.value;
        // Kemas kini bahagian Emel DELIMa tanpa hilang fokus input
        if (ui.loginRole === 'student') {
          const trimmedId = ui.loginIdentity.trim().toUpperCase();
          const isReturning =
            trimmedId.length > 0 &&
            state.members.some((m) => m.identityNumber.toUpperCase() === trimmedId);
          const wrapper = document.getElementById('login-delima-wrapper');
          const submitSpan = document.querySelector('#btn-login-submit span');

          if (wrapper) {
            wrapper.innerHTML = !isReturning
              ? `<div>
                  <label class="text-xs font-semibold text-slate-300 block mb-1.5">
                    Emel DELIMa <span class="text-rose-400">*</span>
                  </label>
                  <div class="relative">
                    <i data-lucide="mail" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500"></i>
                    <input
                      type="email"
                      id="input-login-email"
                      required
                      value="${escapeHtml(ui.loginDelimaEmail)}"
                      class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-amber-500 transition-colors"
                    />
                  </div>
                  <p class="text-[11px] text-slate-500 mt-1.5">
                    Diperlukan untuk pendaftaran kali pertama sahaja.
                  </p>
                </div>`
              : `<div class="p-3 rounded-xl bg-emerald-950/40 border border-emerald-500/30 flex items-center gap-2 text-xs text-emerald-300">
                  <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400 shrink-0"></i>
                  <span>Rekod berdaftar ditemui. Terus tekan butang di bawah untuk log masuk.</span>
                </div>`;

            document.getElementById('input-login-email')?.addEventListener('input', (ev) => {
              ui.loginDelimaEmail = ev.target.value;
            });
            if (window.lucide) lucide.createIcons();
          }

          if (submitSpan) {
            submitSpan.textContent = isReturning ? 'Log Masuk ke Portal Pelajar' : 'Daftar & Log Masuk';
          }
        }
      });

      document.getElementById('input-login-email')?.addEventListener('input', (e) => {
        ui.loginDelimaEmail = e.target.value;
      });

      document.getElementById('login-form')?.addEventListener('submit', handleLoginSubmit);
    }

    // ----------------------------------------------------------------------------

        checkedOutCopies: state.copies.filter((c) => c.status === 'Dipinjam').length,
        overdueLoans: enrichedLoans.filter((l) => l.effectiveStatus === 'Tertunggak').length,
        activeHolds: state.holds.filter((h) => h.status === 'Menunggu' || h.status === 'Sedia Diambil').length

                  cloudStatus === 'synced'
                    ? 'bg-emerald-950/50 border-emerald-500/30 text-emerald-300 hover:bg-emerald-900/50'
                    : cloudStatus === 'syncing'
                    ? 'bg-amber-950/50 border-amber-500/30 text-amber-300'

                <i data-lucide="refresh-cw" class="w-3.5 h-3.5 ${

                    : 'text-rose-400'

              <div class="hidden md:flex items-center gap-2.5 bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5">

        <!-- Kandungan Utama -->
        <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 space-y-6">

    function renderStatCard(label, value, iconName, colorClass) {
      return `

        </div>
      `;

    // ----------------------------------------------------------------------------
    // 2A. SEKSYEN PAPARAN PELAJAR
    // ----------------------------------------------------------------------------
    function renderStudentSection(enrichedLoans) {
      const activePatron =
        state.members.find((m) => m.id === state.currentUser.id) || state.members[0];
      if (!activePatron) return '';

      const patronActiveLoans = enrichedLoans.filter(
        (l) => l.patronId === activePatron.id && l.effectiveStatus !== 'Dipulangkan'
      );
      const patronPastLoans = enrichedLoans.filter(
        (l) => l.patronId === activePatron.id && l.effectiveStatus === 'Dipulangkan'
      );
      const patronHolds = state.holds.filter(
        (h) => h.patronId === activePatron.id && h.status !== 'Dibatalkan' && h.status !== 'Selesai'
      );
      const patronLiveFines = patronActiveLoans.reduce((sum, l) => sum + l.accruedFine, 0);
      const totalFines = activePatron.fineBalance + patronLiveFines;

      const studentTabs = [
        { id: 'loans', label: `Pinjaman Saya (${patronActiveLoans.length})`, icon: 'book-open' },
        { id: 'holds', label: `Tempahan Saya (${patronHolds.length})`, icon: 'bookmark' },
        { id: 'settings', label: 'Tetapan Akaun', icon: 'settings' }
      ];

      if (!studentTabs.some((t) => t.id === ui.activeTab)) {
        ui.activeTab = 'loans';
      }

      let tabContentHtml = '';

      if (ui.activeTab === 'loans') {
        tabContentHtml = `
          <div class="space-y-6">
            <div>
              <h3 class="text-sm font-bold text-white mb-3">Pinjaman Aktif</h3>
              ${
                patronActiveLoans.length === 0
                  ? `<div class="bg-slate-900/50 border border-slate-800 rounded-2xl p-8 text-center text-xs text-slate-400">
                      Anda tidak mempunyai sebarang pinjaman aktif buat masa ini.
                    </div>`
                  : `<div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                      ${patronActiveLoans
                        .map(
                          (loan) => `
                        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex items-center justify-between gap-4">
                          <div>
                            <div class="flex items-center gap-2">
                              <span class="text-[11px] font-mono px-2 py-0.5 rounded bg-slate-800 text-slate-300">
                                ${escapeHtml(loan.copyId)}
                              </span>
                              <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full ${
                                loan.effectiveStatus === 'Tertunggak'
                                  ? 'bg-rose-500/20 text-rose-300 border border-rose-500/30'
                                  : 'bg-emerald-500/15 text-emerald-300 border border-emerald-500/30'
                              }">
                                ${escapeHtml(loan.effectiveStatus)}
                              </span>
                            </div>
                            <h4 class="font-bold text-white text-sm mt-1.5">${escapeHtml(loan.bookTitle)}</h4>
                            <p class="text-xs text-slate-400 mt-1">
                              Tarikh Pinjam: ${escapeHtml(loan.issueDate)} •
                              <span class="${
                                loan.effectiveStatus === 'Tertunggak'
                                  ? 'text-rose-400 font-semibold'
                                  : 'text-slate-200'
                              }">
                                Tarikh Pulang: ${escapeHtml(loan.dueDate)}
                              </span>
                            </p>
                            ${
                              loan.accruedFine > 0
                                ? `<p class="text-xs text-rose-400 font-semibold mt-1">
                                    Denda Terkumpul: RM ${loan.accruedFine.toFixed(2)} (${loan.overdueDays} hari lewat)
                                  </p>`
                                : ''
                            }
                          </div>
                          <div class="flex flex-col items-end gap-2">
                            <button
                              type="button"
                              data-loan-id="${escapeHtml(loan.id)}"
                              ${
                                loan.effectiveStatus === 'Tertunggak' || loan.renewals >= MAX_RENEWALS
                                  ? 'disabled'
                                  : ''
                              }
                              class="btn-student-renew px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed text-xs font-semibold text-white border border-slate-700 transition-colors"
                            >
                              Perbaharui (${loan.renewals}/${MAX_RENEWALS})
                            </button>
                          </div>
                        </div>`
                        )
                        .join('')}
                    </div>`
              }
            </div>

            ${
              patronPastLoans.length > 0
                ? `<div>
                    <h3 class="text-sm font-bold text-slate-300 mb-3">Rekod Pinjaman Terdahulu</h3>
                    <div class="bg-slate-900/60 border border-slate-800 rounded-2xl overflow-hidden">
                      <table class="w-full text-left text-xs">
                        <thead class="bg-slate-900 text-slate-400 border-b border-slate-800">
                          <tr>
                            <th class="p-3">Judul Buku</th>
                            <th class="p-3">Naskhah</th>
                            <th class="p-3">Tarikh Pinjam</th>
                            <th class="p-3">Tarikh Dipulangkan</th>
                            <th class="p-3">Denda</th>
                          </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-800/60 text-slate-300">
                          ${patronPastLoans
                            .map(
                              (l) => `
                            <tr>
                              <td class="p-3 font-medium text-white">${escapeHtml(l.bookTitle)}</td>
                              <td class="p-3 font-mono">${escapeHtml(l.copyId)}</td>
                              <td class="p-3">${escapeHtml(l.issueDate)}</td>
                              <td class="p-3">${escapeHtml(l.returnDate)}</td>
                              <td class="p-3">RM ${l.fineAmount.toFixed(2)}</td>
                            </tr>`
                            )
                            .join('')}
                        </tbody>
                      </table>
                    </div>
                  </div>`
                : ''
            }
          </div>
        `;
      } else if (ui.activeTab === 'holds') {
        tabContentHtml = `
          <div class="space-y-3">
            <h3 class="text-sm font-bold text-white">Senarai Tempahan & Pengambilan</h3>
            ${
              patronHolds.length === 0
                ? `<div class="bg-slate-900/50 border border-slate-800 rounded-2xl p-8 text-center text-xs text-slate-400">
                    Anda tidak mempunyai sebarang tempahan buku buat masa ini.
                  </div>`
                : `<div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    ${patronHolds
                      .map((hold) => {
                        const book = state.books.find((b) => b.id === hold.bookId);
                        const queuePos =
                          state.holds
                            .filter((h) => h.bookId === hold.bookId && h.status === 'Menunggu')
                            .findIndex((h) => h.id === hold.id) + 1;

                        return `
                          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex items-center justify-between gap-4">
                            <div>
                              <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full ${
                                hold.status === 'Sedia Diambil'
                                  ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30'
                                  : 'bg-purple-500/20 text-purple-300 border border-purple-500/30'
                              }">
                                ${
                                  hold.status === 'Sedia Diambil'
                                    ? `Sedia Diambil (Naskhah ${escapeHtml(hold.assignedCopyId)})`
                                    : `Giliran Menunggu #${queuePos}`
                                }
                              </span>
                              <h4 class="font-bold text-white text-sm mt-1.5">${escapeHtml(book?.title)}</h4>
                              <p class="text-xs text-slate-400 mt-1">
                                Ditempah pada ${escapeHtml(hold.requestDate)}
                                ${hold.expiryDate ? ` • Tamat tempoh ambil: ${escapeHtml(hold.expiryDate)}` : ''}
                              </p>
                            </div>
                            <div class="flex flex-col gap-1.5">
                              ${
                                hold.status === 'Sedia Diambil' && hold.assignedCopyId
                                  ? `<button
                                      type="button"
                                      data-copy-id="${escapeHtml(hold.assignedCopyId)}"
                                      class="btn-student-borrow px-3 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-950 font-semibold text-xs"
                                    >
                                      Ambil & Pinjam
                                    </button>`
                                  : ''
                              }
                              <button
                                type="button"
                                data-hold-id="${escapeHtml(hold.id)}"
                                class="btn-student-cancel-hold px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs"
                              >
                                Batal
                              </button>
                            </div>
                          </div>
                        `;
                      })
                      .join('')}
                  </div>`
            }
          </div>

              <div class="pt-2 flex justify-end">

            </form>

          <!-- Pengurusan Staf & Sandaran Data -->
          <div class="space-y-5">

              <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <div class="flex items-center gap-2">
                  <i data-lucide="shield-check" class="w-4 h-4 text-emerald-400"></i>
                  <h3 class="font-bold text-white text-sm">Senarai Staf Perpustakaan (${state.staffList.length})</h3>
                </div>
              </div>
              <div class="space-y-2 max-h-48 overflow-y-auto pr-1 text-xs">
                ${state.staffList
                  .map(
                    (stf) => `
                  <div class="flex items-center justify-between p-2.5 rounded-xl bg-slate-950 border border-slate-800">
                    <div>
                      <p class="font-bold text-white">${escapeHtml(stf.name)}</p>
                      <p class="text-[11px] font-mono text-slate-400">${escapeHtml(stf.identityNumber)} • ${escapeHtml(stf.position || 'Staf Perpustakaan')}</p>
                    </div>
                    ${
                      stf.identityNumber !== '101124110387' && stf.identityNumber !== state.currentUser.identityNumber
                        ? `<button type="button" data-staff-id="${escapeHtml(stf.id)}" class="btn-remove-staff px-2.5 py-1 rounded-lg bg-rose-500/15 hover:bg-rose-500/25 text-rose-300 border border-rose-500/30 font-semibold">
                            Lucut Staf
                          </button>`

              </div>

            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3 text-xs">
              <div class="flex items-center gap-2 border-b border-slate-800 pb-3">
                <i data-lucide="database" class="w-4 h-4 text-sky-400"></i>
                <h3 class="font-bold text-white text-sm">Sandaran & Penyelarasan Cloud</h3>
              </div>
              <p class="text-slate-400 leading-relaxed">

                <button type="button" id="btn-export-backup-json" class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-semibold border border-slate-700 flex items-center gap-1.5">
                  <i data-lucide="download" class="w-3.5 h-3.5 text-amber-400"></i>
                  Muat Turun Sandaran (JSON)
                </button>
                <button type="button" id="btn-force-push-cloud" class="px-3.5 py-2 rounded-xl bg-emerald-500/15 hover:bg-emerald-500/25 text-emerald-300 border border-emerald-500/30 font-semibold flex items-center gap-1.5">

    return `
      <div class="space-y-6">
          <div class="flex flex-wrap gap-2 border-b border-slate-800 pb-3">
            ${staffTabs
              .map(
                (tab) => `
              <button
                type="button"
                data-tab="${tab.id}"
                class="btn-nav-tab flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-semibold transition-all ${
                  ui.activeTab === tab.id
                    ? 'bg-amber-500 text-slate-950 shadow-lg shadow-amber-500/20'
                    : 'bg-slate-900 text-slate-400 hover:text-white border border-slate-800'
                }"
              >
                <i data-lucide="${tab.icon}" class="w-3.5 h-3.5"></i>
                ${escapeHtml(tab.label)}
              </button>`
              )
              .join('')}
          </div>

          ${tabHtml}
        </div>
      `;
    }

    function bindDashboardEvents() {
      // Bar Atas
      document.getElementById('btn-sync-cloud-header')?.addEventListener('click', () => {
        fetchFromCloud(APPS_SCRIPT_URL, false);
      });

      document.getElementById('btn-download-barcode')?.addEventListener('click', downloadStudentBarcode);

      document.getElementById('btn-logout')?.addEventListener('click', handleLogout);

      // Penukaran Tab
      document.querySelectorAll('.btn-nav-tab').forEach((btn) => {
        btn.addEventListener('click', () => {
          ui.activeTab = btn.getAttribute('data-tab');
          render();
        });
      });

      // Carian & Kategori Pelajar
      document.getElementById('input-student-search')?.addEventListener('input', (e) => {
        ui.searchQuery = e.target.value;
        const pos = e.target.selectionStart;
        render();
        const newInput = document.getElementById('input-student-search');
        if (newInput) {
          newInput.focus();
          newInput.setSelectionRange(pos, pos);
        }
      });

      document.querySelectorAll('.btn-select-cat').forEach((btn) => {
        btn.addEventListener('click', () => {
          ui.selectedCategory = btn.getAttribute('data-cat');
          render();
        });
      });

      // Tindakan Pelajar
      document.querySelectorAll('.btn-student-borrow').forEach((btn) => {
        btn.addEventListener('click', () => {
          const copyId = btn.getAttribute('data-copy-id');
          handleCheckout(state.currentUser.id, copyId);
        });
      });

      document.querySelectorAll('.btn-student-hold').forEach((btn) => {
        btn.addEventListener('click', () => {
          const bookId = btn.getAttribute('data-book-id');
          handlePlaceHold(bookId, state.currentUser.id);
        });
      });

      document.querySelectorAll('.btn-student-renew').forEach((btn) => {
        btn.addEventListener('click', () => {
          const loanId = btn.getAttribute('data-loan-id');
          handleRenewLoan(loanId);
        });
      });

      document.querySelectorAll('.btn-student-cancel-hold').forEach((btn) => {
        btn.addEventListener('click', () => {
          const holdId = btn.getAttribute('data-hold-id');
          handleCancelHold(holdId);
        });
      });

      // Kaunter Pinjaman Staf
      document.getElementById('select-checkout-patron')?.addEventListener('change', (e) => {
        ui.checkoutPatronId = e.target.value;
        render();
      });

      document.getElementById('input-checkout-copy')?.addEventListener('input', (e) => {
        ui.checkoutCopyId = e.target.value;
        const pos = e.target.selectionStart;
        render();
        const newInput = document.getElementById('input-checkout-copy');
        if (newInput) {
          newInput.focus();
          newInput.setSelectionRange(pos, pos);
        }
      });

      document.getElementById('select-checkout-copy-quick')?.addEventListener('change', (e) => {
        ui.checkoutCopyId = e.target.value;
        render();
      });

      document.getElementById('btn-confirm-checkout')?.addEventListener('click', () => {
        handleCheckout(ui.checkoutPatronId, ui.checkoutCopyId);
      });

      // Kaunter Pemulangan Staf
      document.getElementById('input-checkin-copy')?.addEventListener('input', (e) => {
        ui.checkinCopyId = e.target.value;
      });

      document.getElementById('select-checkin-copy-quick')?.addEventListener('change', (e) => {
        ui.checkinCopyId = e.target.value;
        render();
      });

      document.getElementById('checkbox-checkin-damaged')?.addEventListener('change', (e) => {
        ui.checkinDamaged = e.target.checked;
      });

      document.getElementById('btn-confirm-checkin')?.addEventListener('click', () => {
        handleCheckin(ui.checkinCopyId, ui.checkinDamaged);
      });

      document.querySelectorAll('.btn-quick-checkin').forEach((btn) => {
        btn.addEventListener('click', () => {
          const copyId = btn.getAttribute('data-copy-id');
          handleCheckin(copyId, false);
        });
      });

      // Katalog Staf
      document.getElementById('btn-open-add-book')?.addEventListener('click', () => {
        ui.activeModal = 'addBook';
        renderModals();
        if (window.lucide) lucide.createIcons();
      });

      document.getElementById('btn-open-import-books')?.addEventListener('click', () => {
        ui.activeModal = 'importBooks';
        renderModals();
        if (window.lucide) lucide.createIcons();
      });

      document.querySelectorAll('.btn-open-add-copy').forEach((btn) => {
        btn.addEventListener('click', () => {
          const bookId = btn.getAttribute('data-book-id');
          ui.selectedBookForCopies = state.books.find((b) => b.id === bookId) || null;
          ui.activeModal = 'addCopy';
          renderModals();
          if (window.lucide) lucide.createIcons();
        });
      });

      document.querySelectorAll('.btn-edit-book').forEach((btn) => {
        btn.addEventListener('click', () => {
          const bookId = btn.getAttribute('data-book-id');
          ui.editingBook = state.books.find((b) => b.id === bookId) || null;
          if (!ui.editingBook) return;
          ui.activeModal = 'editBook';
          renderModals();
          if (window.lucide) lucide.createIcons();
        });
      });

      document.querySelectorAll('.btn-delete-book').forEach((btn) => {
        btn.addEventListener('click', () => {
          const bookId = btn.getAttribute('data-book-id');
          const book = state.books.find((b) => b.id === bookId);
          if (!book) return;
          ui.deleteTarget = { type: 'book', id: book.id, title: book.title };
          ui.activeModal = 'confirmDelete';
          renderModals();
          if (window.lucide) lucide.createIcons();
        });
      });

      // Ahli Staf
      document.getElementById('btn-open-add-member')?.addEventListener('click', () => {
        ui.activeModal = 'addMember';
        renderModals();
        if (window.lucide) lucide.createIcons();
      });

      document.getElementById('btn-open-import-members')?.addEventListener('click', () => {
        ui.activeModal = 'importMembers';
        renderModals();
        if (window.lucide) lucide.createIcons();
      });

      document.querySelectorAll('.btn-settle-fine').forEach((btn) => {
        btn.addEventListener('click', () => {
          handleSettleFines(btn.getAttribute('data-member-id'));
        });
      });

      document.querySelectorAll('.btn-promote-staff').forEach((btn) => {
        btn.addEventListener('click', () => {
          handlePromoteToStaff(btn.getAttribute('data-member-id'));
        });
      });

      document.querySelectorAll('.btn-edit-member').forEach((btn) => {
        btn.addEventListener('click', () => {
          const memberId = btn.getAttribute('data-member-id');
          ui.editingMember = state.members.find((m) => m.id === memberId) || null;
          if (!ui.editingMember) return;
          ui.activeModal = 'editMember';
          renderModals();
          if (window.lucide) lucide.createIcons();
        });
      });

      document.querySelectorAll('.btn-toggle-member').forEach((btn) => {
        btn.addEventListener('click', () => {
          handleToggleMemberStatus(btn.getAttribute('data-member-id'));
        });
      });

      document.querySelectorAll('.btn-delete-member').forEach((btn) => {
        btn.addEventListener('click', () => {
          const memberId = btn.getAttribute('data-member-id');
          const member = state.members.find((m) => m.id === memberId);
          if (!member) return;
          ui.deleteTarget = { type: 'member', id: member.id, title: `${member.name} (${member.identityNumber})` };
          ui.activeModal = 'confirmDelete';
          renderModals();
          if (window.lucide) lucide.createIcons();
        });
      });

      // Tetapan Akaun Pelajar
      document.getElementById('form-student-settings')?.addEventListener('submit', (e) => {
        e.preventDefault();
        const newName = e.target.name.value.trim().toUpperCase();
        const newEmail = e.target.email.value.trim().toLowerCase();
        if (!newName || !newEmail) return;

        state.members = state.members.map((m) =>
          m.id === state.currentUser.id ? { ...m, name: newName, email: newEmail } : m
        );
        state.currentUser.name = newName;
        state.currentUser.email = newEmail;
        addLog('sistem', `Profil Dikemas Kini: ${newName} mengemas kini maklumat akaun & Emel DELIMa.`);
        saveState();
        notify('Tetapan akaun berjaya disimpan!');
        render();
      });

      // Tetapan Sistem Staf
      document.getElementById('form-system-settings')?.addEventListener('submit', (e) => {
        e.preventDefault();
        const f = e.target;
        const studentLimit = Math.max(1, parseInt(f.studentMaxLimit.value, 10) || 5);
        const teacherLimit = Math.max(1, parseInt(f.teacherMaxLimit.value, 10) || 10);

        state.settings = {
          ...state.settings,
          loanDurationDays: Math.max(1, parseInt(f.loanDurationDays.value, 10) || 14),
          dailyFineRate: Math.max(0, parseFloat(f.dailyFineRate.value) || 0.5),
          maxRenewals: Math.max(0, parseInt(f.maxRenewals.value, 10) || 2),
          fineBlockThreshold: Math.max(1, parseFloat(f.fineBlockThreshold.value) || 10),
          studentMaxLimit: studentLimit,
          teacherMaxLimit: teacherLimit
        };

        state.members = state.members.map((m) => ({
          ...m,
          maxLimit: m.tier === 'Guru' ? teacherLimit : studentLimit
        }));

        addLog('sistem', `Tetapan Sistem Dikemas Kini oleh ${state.currentUser.name}.`);
        saveState();
        notify('Tetapan sistem perpustakaan berjaya disimpan!');
        render();
      });

      document.querySelectorAll('.btn-remove-staff').forEach((btn) => {
        btn.addEventListener('click', () => {
          const staffId = btn.getAttribute('data-staff-id');
          const target = state.staffList.find((s) => s.id === staffId);
          if (!target) return;
          state.staffList = state.staffList.filter((s) => s.id !== staffId);
          addLog('sistem', `Akses Staf Dilucutkan: ${target.name} (${target.identityNumber}).`);
          saveState();
          notify(`Akses staf bagi ${target.name} telah dibuang.`);
          render();
        });
      });

      document.getElementById('btn-export-backup-json')?.addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `SANDARAN-PERPUSTAKAAN-IBNU-SINA-${state.systemDate}.json`;
        a.click();
        URL.revokeObjectURL(url);
        notify('Fail sandaran JSON berjaya dimuat turun.');
      });

      document.getElementById('btn-force-push-cloud')?.addEventListener('click', () => {
        pushToCloud(state, APPS_SCRIPT_URL).then(() => notify('Data berjaya dihantar ke Google Sheets!'));
      });
    }

    // 3. MODALS (TAMBAH BUKU, IMPORT CSV, DLL.)
    // ----------------------------------------------------------------------------
    function renderModals() {

      if (!ui.activeModal) {
        container.innerHTML = '';
        return;
      }

        container.innerHTML = `

              <div class="flex items-center justify-between">
                <h3 class="font-bold text-white text-base">Tambah Judul Buku Baharu</h3>
                <button type="button" class="btn-close-modal text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
              </div>
              <form id="form-add-book" class="space-y-3 text-xs">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
